<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mindbranches</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>mindbranches</h1>
    <p class="tagline">prose to branching diagrams</p>
  </header>

  <section class="form">
    <div class="field">
      <label for="filepath">Filepath</label>
      <input type="text" id="filepath" placeholder="/absolute/path/to/notes.txt" autocomplete="off" autofocus>
    </div>

    <div class="row">
      <div class="field">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="cream" selected>Cream</option>
          <option value="dark">Dark</option>
          <option value="mono">Mono</option>
        </select>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <select id="model">
          <option value="flash" selected>Gemini 2.5 Flash</option>
          <option value="flash-lite">Gemini 2.5 Flash-Lite</option>
        </select>
      </div>
      <div class="field">
        <label for="width">Width (px)</label>
        <input type="number" id="width" value="1600" min="800" max="4000" step="50">
      </div>
    </div>

    <div class="field">
      <label for="root">Root override (optional)</label>
      <input type="text" id="root" placeholder="leave blank to let the model choose">
    </div>

    <button id="submit">Generate</button>
  </section>

  <section class="status" id="status" hidden>
    <h2>Status</h2>
    <ol id="status-trail"></ol>
  </section>

  <section class="downloads" id="downloads" hidden>
    <h2>Outputs</h2>
    <div id="download-row"></div>
  </section>

  <section class="error" id="error" hidden>
    <h2>Error</h2>
    <pre id="error-message"></pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
