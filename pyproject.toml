[project]
name = "mindbranches"
version = "0.1.0"
description = "Generate MindBranches-style horizontal mind-map diagrams from prose."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Justin Wang", email = "justinwanghx@gmail.com"},
]
keywords = ["mindmap", "diagram", "visualization", "gemini", "llm", "svg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
mindbranches = "mindbranches.cli:main"
mindbranches-portal = "mindbranches.server:main"

[project.urls]
Homepage = "https://github.com/jstwng/mindbranches"
Repository = "https://github.com/jstwng/mindbranches"
Issues = "https://github.com/jstwng/mindbranches/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mindbranches = ["fonts/*.ttf", "templates/*.j2", "static/*"]
